<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detective Map - Spatial Thinking Canvas</title>
  <link rel="stylesheet" href="canvas.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Floating Toolbar -->
    <header id="toolbar">
      <div class="toolbar-group brand-group">
        <span class="logo">🔍</span>
        <span class="title">Detective Map</span>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Mode & Drawing Tools -->
      <div class="toolbar-group tool-group">
        <button id="tool-select" class="tool-btn active" data-tool="select" title="Select & Drag Cards / Pan Canvas (V)">
          <span class="btn-icon">👆</span>
          <span class="btn-label">Select</span>
        </button>
        <button id="tool-pen" class="tool-btn" data-tool="pen" title="Pen / Apple Pencil (P)">
          <span class="btn-icon">✍️</span>
          <span class="btn-label">Pen</span>
        </button>
        <button id="tool-highlighter" class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
          <span class="btn-icon">🖍</span>
          <span class="btn-label">Highlighter</span>
        </button>
        <button id="tool-eraser" class="tool-btn" data-tool="eraser" title="Stroke Eraser (E)">
          <span class="btn-icon">🧽</span>
          <span class="btn-label">Eraser</span>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Actions -->
      <div class="toolbar-group action-group">
        <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)">
          <span class="btn-icon">↩</span>
          <span class="btn-label">Undo</span>
        </button>
        <button id="btn-clear-ink" class="action-btn" title="Clear Ink Strokes">
          <span class="btn-icon">🧹</span>
          <span class="btn-label">Clear Ink</span>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Zoom Controls -->
      <div class="toolbar-group zoom-group">
        <button id="btn-zoom-out" class="icon-btn" title="Zoom Out (−)">−</button>
        <span id="zoom-level" class="zoom-text" title="Click to reset 100%">100%</span>
        <button id="btn-zoom-in" class="icon-btn" title="Zoom In (+)">+</button>
        <button id="btn-zoom-fit" class="icon-btn" title="Fit to Content (F)">🎯</button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Backup & Sync -->
      <div class="toolbar-group backup-group">
        <button id="btn-export-canvas" class="action-btn" title="Export Backup JSON">
          <span class="btn-icon">💾</span>
          <span class="btn-label">Export</span>
        </button>
        <label class="action-btn file-label" title="Import Backup JSON">
          <span class="btn-icon">📂</span>
          <span class="btn-label">Import</span>
          <input type="file" id="file-import-canvas" accept=".json" style="display:none;">
        </label>
      </div>
    </header>

    <!-- Infinite Viewport Layer -->
    <main id="viewport-container">
      <!-- Infinite Dot Grid -->
      <div id="grid-background"></div>

      <!-- World Cards Container (synchronized via transform) -->
      <div id="world-cards-layer"></div>

      <!-- Full-Screen Ink Canvas (hardware accelerated) -->
      <canvas id="ink-canvas"></canvas>
    </main>

    <!-- Bottom Status Bar -->
    <footer id="status-bar">
      <div class="status-left">
        <span id="pointer-device-tag" class="status-pill">📱 Pointer: Ready</span>
        <span id="coords-tag" class="status-pill">World: (0, 0)</span>
      </div>
      <div class="status-right">
        <span id="card-count-tag" class="status-pill">0 Cards</span>
        <span id="stroke-count-tag" class="status-pill">0 Strokes</span>
        <span class="status-pill hint-pill">iPad Display Mode Active</span>
      </div>
    </footer>
  </div>

  <script src="shared/storage.js"></script>
  <script src="shared/canvas-core.js"></script>
  <script src="canvas.js"></script>
</body>
</html>

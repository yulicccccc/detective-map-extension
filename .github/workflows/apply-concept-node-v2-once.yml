name: Apply Concept Node V2 Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-concept-node-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Concept Node V2 patch
        run: node scripts/apply-concept-node-v2.js

      - name: Verify focused Concept Node suite
        run: node tests/verify-concept-nodes-v2.js

      - name: Commit migration and remove one-time activation files
        shell: bash
        run: |
          git config user.name 'detective-map-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm scripts/apply-concept-node-v2.js
          git rm .github/workflows/apply-concept-node-v2-once.yml
          git add canvas.css canvas.js tests/verify-concept-nodes-v2.js .github/workflows/verify-generated-assets.yml PROJECT_STATE.md .ai-bridge/current-plan.md
          git diff --cached --check
          git commit -m 'feat(ui): adopt soft adaptive Concept nodes [skip ci]'
          git push origin HEAD:main

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detective Map — Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="sidepanel-container">
    <!-- Header -->
    <header class="sp-header">
      <div class="sp-brand">
        <span class="sp-logo">🔍</span>
        <span class="sp-title">Detective Map</span>
      </div>
      <div class="sp-actions">
        <button id="btn-open-canvas" class="btn-icon-text" title="Open Full Screen Canvas Window">
          <span>↗</span> Canvas
        </button>
      </div>
    </header>

    <!-- Active Workspace Selector -->
    <section class="sp-workspace-section">
      <label class="sp-section-label">Active Learning Map</label>
      <div class="sp-workspace-row">
        <select id="sp-select-workspace" class="sp-dropdown"></select>
        <button id="sp-btn-new-ws" class="sp-btn-sm" title="New Learning Topic">+</button>
      </div>
    </section>

    <!-- Ingestion Banner -->
    <section class="sp-ingest-bar">
      <button id="sp-btn-add-source" class="btn-primary-block">
        <span>📥</span> + Add Notes / Article
      </button>
    </section>

    <!-- Sources & Capture Feed -->
    <main class="sp-content">
      <div class="sp-section-header">
        <span class="sp-section-label">Captured Sources & Evidence</span>
        <span id="sp-source-count" class="sp-badge">0</span>
      </div>
      <div id="sp-source-feed" class="sp-feed"></div>
    </main>

    <!-- Footer -->
    <footer class="sp-footer">
      <div class="sp-status">
        <span class="sp-dot"></span>
        <span id="sp-sync-status">Sync Active</span>
      </div>
      <span class="sp-hint">Select text in ChatGPT → Right-click to capture</span>
    </footer>
  </div>

  <script src="shared/storage.js"></script>
  <script src="shared/canvas-core.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
